services:
  backend:
    build:
      context: ./backend
    container_name: agenda-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgres://user:password@host.docker.internal:5432/agenda_db

  frontend:
    build:
      context: ./frontend
    container_name: agenda-web
    restart: always
    ports:
      - "5001:5001"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
